services:
  storage-service:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - STORAGE_API_KEY=my-secure-key
      - STORAGE_DIR=/data
      - MAX_BUCKET_SIZE_GB=1
    volumes:
      - ./storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
